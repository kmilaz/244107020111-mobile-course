org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# WAJIB di lingkungan ini. Pub cache berada di drive C: sedangkan project di
# drive D:, dan cache incremental Kotlin tidak bisa membuat path relatif antar
# drive (RelocatableFileToPathConverter.toPath) sehingga task compileDebugKotlin
# gagal menutup cache-nya. Mematikan kompilasi inkremental menghilangkan
# direktori cache yang bermasalah itu.
kotlin.incremental=false
